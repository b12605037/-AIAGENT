<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>影音平台觀看行為研究 | AI 訪談 Agent</title>
    <style>
        :root { --primary: #1D9E75; --bg: #f4f7f6; }
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg); }
        #sidebar { width: 280px; background: #2c3e50; color: white; padding: 20px; box-sizing: border-box; }
        #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
        .ai { align-self: flex-start; background: white; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user { align-self: flex-end; background: var(--primary); color: white; }
        #input-zone { padding: 20px; background: white; border-top: 1px solid #ddd; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 25px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--primary); color: white; }
        .hidden { display: none; }
        .error-text { color: #e74c3c; font-weight: bold; background: #fdf2f2; border: 1px solid #e74c3c; }
    </style>
</head>
<body>
<div id="sidebar">
    <h3>訪談進度</h3>
    <p>研究對象：18-35歲影音用戶</p>
    <hr style="opacity: 0.3;">
    <button onclick="exportTranscript()" style="width:100%; background:#95a5a6; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer;">匯出逐字稿</button>
</div>
<div id="chat-area">
    <div id="messages"></div>
    <div id="input-zone">
        <div id="button-group" class="btn-group hidden"></div>
        <div id="text-input-group">
            <input type="text" id="user-input" style="width:75%; padding:12px; border-radius:8px; border:1px solid #ddd;" placeholder="請輸入您的回答...">
            <button onclick="sendText()" style="margin-left:8px;">送出</button>
        </div>
    </div>
</div>

<script>
const Q_OPTS = {
    "0": ["同意", "不同意"],
    "1": ["18 歲以下", "18–25 歲", "26–35 歲"],
    "2": ["完整劇集", "完整電影", "劇情解說／濃縮影片", "以上都不太看"],
    "3": ["有，自己付費", "有，和人共用", "沒有"],
    "4": ["幾乎每天", "一週幾次", "一個月幾次", "很少看", "幾乎不看"],
    "5": ["只看完整版", "只看濃縮版", "先看濃縮再看完整", "兩者皆看無順序", "看情況"],
    "6": ["韓劇", "歐美影集", "台劇／華語劇", "日劇／動漫", "電影", "紀錄片", "無特定偏好"],
    "8": ["原速看完", "加速看完", "看一半", "只看開頭", "不一定"],
    "9": ["追完原版", "挑片段看", "不看原版", "看情況"],
    "11": ["原速追完", "加速追完", "很高機率放棄", "喜歡才追完"]
};

let chatHistory = [];
const PROMPT = "你是一位專業訪談員。規則：1.一次只問一題。2.若受訪者點選「同意」，請立即詢問年齡區間並加上 [SHOW_Q1]。3.若該題有選項，結尾必須加上 [SHOW_Q數字]，不要列出選項。";

async function sendText(overrideText) {
    const val = overrideText || document.getElementById('user-input').value;
    if(!val) return;
    
    appendMsg('user', val);
    document.getElementById('user-input').value = '';
    chatHistory.push({ role: "user", parts: [{ text: val }] });

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                system_instruction: { parts: [{ text: PROMPT }] }, 
                contents: chatHistory 
            })
        });
        
        const data = await res.json();

        if (data.error) {
            appendMsg('ai', `API 錯誤：${data.error.message}`, true);
            return;
        }

        if (data.candidates && data.candidates[0].content) {
            const aiMsg = data.candidates[0].content.parts[0].text;
            processAIResponse(aiMsg);
        } else {
            appendMsg('ai', "收到無效回應，請檢查 API 金鑰與設定。", true);
        }
    } catch (e) {
        appendMsg('ai', `連線異常：${e.message}`, true);
    }
}

function processAIResponse(text) {
    chatHistory.push({ role: "model", parts: [{ text: text }] });
    const match = text.match(/\[SHOW_Q(\d+)\]/);
    const cleanText = text.replace(/\[SHOW_Q\d+\]/g, '').trim();
    
    appendMsg('ai', cleanText);

    const btnGroup = document.getElementById('button-group');
    const textGroup = document.getElementById('text-input-group');
    
    if(match && Q_OPTS[match[1]]) {
        btnGroup.innerHTML = '';
        Q_OPTS[match[1]].forEach(opt => {
            const b = document.createElement('button');
            b.innerText = opt;
            b.onclick = () => sendText(opt);
            btnGroup.appendChild(b);
        });
        btnGroup.classList.remove('hidden');
        textGroup.classList.add('hidden');
    } else {
        btnGroup.classList.add('hidden');
        textGroup.classList.remove('hidden');
    }
}

function appendMsg(role, text, isError = false) {
    const m = document.getElementById('messages');
    const d = document.createElement('div');
    d.className = `bubble ${role} ${isError ? 'error-text' : ''}`;
    d.innerText = text;
    m.appendChild(d);
    m.scrollTop = m.scrollHeight;
}

function exportTranscript() {
    let t = "影音平台觀看行為研究 - 訪談逐字稿\n" + "=".repeat(30) + "\n\n";
    t += chatHistory.map(h => `${h.role === 'user' ? '【受訪者】' : '【訪談員】'}\n${h.parts[0].text.replace(/\[SHOW_Q\d+\]/g, '')}`).join('\n\n---\n\n');
    const blob = new Blob([t], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '訪談逐字稿.txt';
    a.click();
}

// 初始化開場
processAIResponse("您好，感謝您撥冗參與本次的影音觀看習慣研究。本訪談採全匿名方式進行，收集之資料僅供課程學術分析使用，絕不外流。請問您是否同意開始訪談？ [SHOW_Q0]");
</script>
</body>
</html>
