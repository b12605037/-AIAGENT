<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>濃縮影片消費行為調查</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1A1917;
    --text-secondary: #6B6760;
    --text-muted: #A09D97;
    --accent: #2D6A4F;
    --accent-light: #E8F3EE;
    --accent-mid: #52B788;
    --bubble-bot: #FFFFFF;
    --bubble-user: #2D6A4F;
    --bubble-user-text: #FFFFFF;
    --header-h: 60px;
    --footer-h: 80px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1917;
      --surface: #252320;
      --surface2: #2E2B28;
      --border: rgba(255,255,255,0.08);
      --text-primary: #F0EDE6;
      --text-secondary: #A09D97;
      --text-muted: #6B6760;
      --accent: #52B788;
      --accent-light: #1A2E24;
      --accent-mid: #2D6A4F;
      --bubble-bot: #252320;
      --bubble-user: #2D6A4F;
    }
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-mid);
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--accent-mid);
    transition: width 0.5s ease;
    width: 0%;
  }

  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-track { background: transparent; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .avatar-user {
    background: var(--accent-mid);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
  }

  .bubble {
    max-width: calc(100% - 52px);
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-primary);
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-color: transparent;
    border-bottom-right-radius: 4px;
    border-bottom-left-radius: 18px;
  }

  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }

  .typing-bubble span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .quick-replies {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-left: 42px;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  .multi-actions {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding-left: 42px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .qr-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--accent-mid);
    background: var(--accent-light);
    color: var(--accent);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: normal;
    text-align: left;
    line-height: 1.35;
  }

  .qr-btn:hover {
    background: var(--accent-mid);
    color: #fff;
    border-color: var(--accent-mid);
    transform: translateY(-1px);
  }

  .qr-btn.selected {
    background: var(--accent-mid);
    color: #fff;
    border-color: var(--accent-mid);
  }

  .qr-btn:active { transform: translateY(0); }

  .qr-confirm {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    max-width: 280px;
  }

  .qr-confirm:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  footer {
    height: var(--footer-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #userInput {
    flex: 1;
    padding: 10px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-primary);
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    resize: none;
    transition: border-color 0.15s;
    min-height: 44px;
    max-height: 100px;
    line-height: 1.5;
  }

  #userInput:focus { border-color: var(--accent-mid); }
  #userInput::placeholder { color: var(--text-muted); }
  #userInput:disabled { opacity: 0.4; cursor: not-allowed; }

  #sendBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  #sendBtn:hover { background: var(--accent-mid); transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  #sendBtn svg { width: 18px; height: 18px; }

  .section-label {
    max-width: 640px;
    width: 100%;
    margin: 4px auto;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
  }

  .end-card {
    max-width: 640px;
    width: 100%;
    margin: 8px auto;
    background: var(--accent-light);
    border: 1px solid var(--accent-mid);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  .end-card .icon { font-size: 28px; margin-bottom: 8px; }
  .end-card h2 { font-size: 17px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .end-card p { font-size: 14px; color: var(--text-secondary); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-dot"></div>
    <h1>濃縮影片消費行為調查</h1>
  </div>
  <div class="progress-bar" id="progressBar"></div>
</header>

<div class="chat-wrap" id="chatWrap"></div>

<footer>
  <div class="input-wrap">
    <textarea id="userInput" placeholder="輸入你的回答…" rows="1" disabled></textarea>
    <button id="sendBtn" disabled aria-label="送出">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</footer>

<script>
/**
 * 分支規則（對齊 questions.md 與研究設計）
 *
 * 1) 影片類型複選：必須包含「劇情解說／濃縮影片」選項，才進入後續核心題。
 *    若未包含（含僅勾選「以上都不太看」），顯示說明後結束，early_exit = video_type_gate。
 *
 * 2) 「你有看過影集或電影的濃縮／解說影片嗎？」選「沒有」→ 結束，early_exit = no_condensed_exposure。
 *
 * 3) 「看完一部濃縮片後，你通常會怎麼做？」若選「看情況，要看是什麼類型的內容」：
 *    追加單選釐清「整體來說哪種狀況較常見」，寫入 answers.after_condensed_followup，
 *    再決定接「有去找原版」或「沒有去找原版」的主要原因複選题（若選「兩種狀況差不多」則兩段原因都詢問）。
 */
const BOT_AVATAR = '🎬';
const ENABLE_SCENARIO = false;
const MAX_TURNS = 2;

const EARLY_EXIT = {
  VIDEO_TYPE_GATE: 'video_type_gate',
  NO_CONDENSED: 'no_condensed_exposure',
};

const OPTION_VIDEO_CONDENSED = '劇情解說／濃縮影片（如「X 分鐘看完整部劇」）';
const OPTION_VIDEO_NONE = '以上都不太看';

const VIDEO_TYPE_OPTIONS = [
  '完整劇集（在串流平台或電視上）',
  '完整電影',
  OPTION_VIDEO_CONDENSED,
  OPTION_VIDEO_NONE,
];

const AFTER_CONDENSED = {
  FULL: '去找原版完整追完',
  PARTIAL: '去找原版，但只挑幾集或片段看',
  NONE: '不會再找原版，濃縮版已經夠了',
  IT_DEPENDS: '看情況，要看是什麼類型的內容',
};

const REASON_OTHER = '其他（請簡短說明）';

const REASONS_ORIGINAL_OPTIONS = [
  '濃縮版讓我對劇情更有興趣，想完整體驗',
  '想看更多細節或情感鋪陳',
  '身邊朋友也在看，想一起討論',
  '濃縮版畫質或剪接不夠好，想看原版',
  REASON_OTHER,
];

const REASONS_NO_ORIGINAL_OPTIONS = [
  '濃縮版看完就知道劇情了，不需要再看',
  '沒有時間看完整版',
  '沒有訂閱平台或取得管道',
  '看完濃縮版後對這部劇的興趣反而降低了',
  REASON_OTHER,
];

let answers = {};
let scenarioHistory = [];
let inScenario = false;
let scenarioTurns = 0;
let freeTextResolver = null;

const chatWrap = document.getElementById('chatWrap');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const progressBar = document.getElementById('progressBar');

function setProgress(p) {
  progressBar.style.width = Math.min(100, Math.max(0, p)) + '%';
}

function delay(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

function passesVideoTypeGate(types) {
  return Array.isArray(types) && types.includes(OPTION_VIDEO_CONDENSED);
}

function createRow(who, text, isTyping = false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (who === 'user' ? ' user' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (who === 'user' ? ' avatar-user' : '');
  avatar.textContent = who === 'user' ? 'ME' : BOT_AVATAR;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = String(text).replace(/\n/g, '<br>');
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  return row;
}

function scrollBottom() {
  setTimeout(() => {
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }, 50);
}

function addUserBubble(text) {
  const row = createRow('user', text);
  chatWrap.appendChild(row);
  scrollBottom();
}

function addBotBubble(text, withTyping = true) {
  return new Promise((resolve) => {
    if (withTyping) {
      const typingRow = createRow('bot', null, true);
      chatWrap.appendChild(typingRow);
      scrollBottom();
      setTimeout(() => {
        typingRow.remove();
        const row = createRow('bot', text);
        chatWrap.appendChild(row);
        scrollBottom();
        resolve();
      }, 900 + Math.random() * 400);
    } else {
      const row = createRow('bot', text);
      chatWrap.appendChild(row);
      scrollBottom();
      resolve();
    }
  });
}

function addSectionLabel(label) {
  const el = document.createElement('div');
  el.className = 'section-label';
  el.textContent = '── ' + label + ' ──';
  chatWrap.appendChild(el);
  scrollBottom();
}

function addQuickReplies(options, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';

  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      wrap.remove();
      onSelect(opt);
    });
    wrap.appendChild(btn);
  });

  chatWrap.appendChild(wrap);
  scrollBottom();
}

function addMultiReplies(options, { min = 1 } = {}) {
  return new Promise((resolve) => {
    const selected = new Set();
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';

    const toggle = (label, btn) => {
      if (label === OPTION_VIDEO_NONE) {
        if (selected.has(OPTION_VIDEO_NONE)) {
          selected.delete(OPTION_VIDEO_NONE);
        } else {
          selected.clear();
          selected.add(OPTION_VIDEO_NONE);
        }
      } else {
        selected.delete(OPTION_VIDEO_NONE);
        if (selected.has(label)) selected.delete(label);
        else selected.add(label);
      }
      syncStyles();
    };

    const syncStyles = () => {
      buttons.forEach(({ label, el }) => {
        el.classList.toggle('selected', selected.has(label));
      });
      confirmBtn.disabled = selected.size < min;
    };

    const buttons = [];
    options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qr-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => toggle(opt, btn));
      wrap.appendChild(btn);
      buttons.push({ label: opt, el: btn });
    });

    const actions = document.createElement('div');
    actions.className = 'multi-actions';
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'qr-confirm';
    confirmBtn.textContent = '完成選擇';
    confirmBtn.disabled = true;
    confirmBtn.addEventListener('click', () => {
      wrap.remove();
      actions.remove();
      resolve([...selected]);
    });
    actions.appendChild(confirmBtn);

    chatWrap.appendChild(wrap);
    chatWrap.appendChild(actions);
    scrollBottom();
  });
}

async function askQuickPick(text, options) {
  await addBotBubble(text);
  return new Promise((resolve) => {
    addQuickReplies(options, async (sel) => {
      addUserBubble(sel);
      await delay(280);
      resolve(sel);
    });
  });
}

async function askMulti(text, options, opts) {
  await addBotBubble(text);
  const picked = await addMultiReplies(options, opts);
  addUserBubble(picked.join('、'));
  await delay(280);
  return picked;
}

async function askOtherSupplement(selection, otherLabel, answerKey) {
  if (!selection.includes(otherLabel)) return;
  await addBotBubble('你選擇了「其他」，請用一句話簡短補充（若不方便填寫可輸入「無」）。');
  const extra = await waitForFreeText();
  answers[answerKey] = extra.trim();
}

function waitForFreeText() {
  return new Promise((resolve) => {
    freeTextResolver = (text) => {
      disableInput();
      resolve(text);
    };
    userInput.placeholder = '輸入補充說明…';
    enableInput();
  });
}

function enableInput() {
  userInput.disabled = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function disableInput() {
  userInput.disabled = true;
  sendBtn.disabled = true;
  userInput.placeholder = '輸入你的回答…';
}

async function finishEarly(exitCode, botLines, endTitle, endBody) {
  await addBotBubble(botLines);
  addEndCard(endTitle, endBody);
  disableInput();
  await saveAnswersPayload({ early_exit: exitCode });
}

function addEndCard(title, bodyHtml) {
  const card = document.createElement('div');
  card.className = 'end-card';
  card.innerHTML =
    '<div class="icon">🎉</div><h2>' +
    title +
    '</h2><p>' +
    bodyHtml +
    '</p>';
  chatWrap.appendChild(card);
  scrollBottom();
}

async function saveAnswersPayload({ early_exit }) {
  const payload = {
    timestamp: new Date().toISOString(),
    early_exit: early_exit || '',
    answers: { ...answers },
    scenario: null,
  };
  if (ENABLE_SCENARIO && answers.scenario_1) {
    payload.scenario = { history: answers.scenario_1 };
  }

  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      console.warn('save failed', res.status, err);
    }
  } catch (e) {
    console.warn('save error', e);
  }
}

function routesToOriginalReasons(choice, followup) {
  if (choice === AFTER_CONDENSED.FULL || choice === AFTER_CONDENSED.PARTIAL)
    return true;
  if (choice === AFTER_CONDENSED.NONE) return false;
  if (choice === AFTER_CONDENSED.IT_DEPENDS) {
    if (followup === '兩種狀況差不多，仍很依內容類型') return true;
    return (
      followup ===
      '整體來說，多數時候我會去找原版（完整追完或挑集／片段）'
    );
  }
  return false;
}

function routesToNoOriginalReasons(choice, followup) {
  if (choice === AFTER_CONDENSED.NONE) return true;
  if (choice === AFTER_CONDENSED.FULL || choice === AFTER_CONDENSED.PARTIAL)
    return false;
  if (choice === AFTER_CONDENSED.IT_DEPENDS) {
    if (followup === '兩種狀況差不多，仍很依內容類型') return true;
    return followup === '整體來說，多數時候我不會再找原版';
  }
  return false;
}

async function runReasonsBlock(wantOriginal, wantNoOriginal) {
  if (wantOriginal) {
    await addBotBubble(
      '承上題，如果你「有去找原版來看」，最主要的原因是？（可複選，按「完成選擇」送出）',
    );
    const sel = await addMultiReplies(REASONS_ORIGINAL_OPTIONS, { min: 1 });
    addUserBubble(sel.join('、'));
    answers.reasons_original = sel;
    await askOtherSupplement(sel, REASON_OTHER, 'reasons_original_other');
    await delay(300);
  }

  if (wantNoOriginal) {
    await addBotBubble(
      '如果你「沒有去找原版來看」，最主要的原因是？（可複選，按「完成選擇」送出）',
    );
    const sel2 = await addMultiReplies(REASONS_NO_ORIGINAL_OPTIONS, { min: 1 });
    addUserBubble(sel2.join('、'));
    answers.reasons_no_original = sel2;
    await askOtherSupplement(sel2, REASON_OTHER, 'reasons_no_original_other');
    await delay(300);
  }
}

async function runScenarioIntro(text) {
  inScenario = true;
  scenarioTurns = 0;
  scenarioHistory = [];
  await addBotBubble(text);
  enableInput();
}

async function handleScenarioReply(userText) {
  scenarioHistory.push({ role: 'user', content: userText });
  scenarioTurns++;

  disableInput();

  const typingRow = createRow('bot', null, true);
  chatWrap.appendChild(typingRow);
  scrollBottom();

  try {
    const summaryLines = [
      `性別：${answers.gender || '—'}`,
      `是否台大學生：${answers.ntu_student || '—'}`,
      `影片類型：${(answers.video_types || []).join('、') || '—'}`,
      `濃縮／解說接觸程度：${answers.condensed_exposure || '—'}`,
      `串流訂閱：${answers.subscription || '—'}`,
      `濃縮片頻率：${answers.condensed_frequency || '—'}`,
      `看完濃縮後通常：${answers.after_condensed || '—'}`,
    ].join('\n');

    const systemPrompt = `你是一個問卷訪談助理，正在進行「濃縮影片消費行為」的研究訪談。

受訪者背景資訊：
${summaryLines}

你正在針對以下情境題進行訪談（題幹可視為背景，請用繁體中文）：
「${SCENARIO_PROMPT_TEXT}」

規則：
1. 語氣輕鬆自然，像朋友在聊天。
2. 每次只問一個追問。
3. 若受訪者已說明行為與原因，直接收尾。
4. 最多追問 ${MAX_TURNS} 輪；目前為第 ${scenarioTurns} 輪（使用者剛完成一則回覆後計數）。
5. 不評價答案；不聊與問卷無關的話題。
6. 收尾時說「謝謝你的分享！」並在訊息最後輸出 [END]。
7. 若回覆太短，溫和請對方多說一點。`;

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: systemPrompt,
        messages: scenarioHistory,
      }),
    });

    const data = await response.json();
    const replyText =
      data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      data?.content?.[0]?.text ||
      '謝謝你的分享！[END]';

    typingRow.remove();

    const isEnd = replyText.includes('[END]') || scenarioTurns >= MAX_TURNS;
    const cleanReply = replyText.replace(/\[END\]/g, '').trim();

    const row = createRow('bot', cleanReply);
    chatWrap.appendChild(row);
    scrollBottom();

    scenarioHistory.push({ role: 'assistant', content: cleanReply });
    answers.scenario_1 = scenarioHistory;

    if (isEnd) {
      inScenario = false;
      await delay(500);
      await afterScenarioDone();
    } else {
      enableInput();
    }
  } catch (err) {
    typingRow.remove();
    const row = createRow('bot', '謝謝你的分享！我們先回到問卷結尾 🙏');
    chatWrap.appendChild(row);
    scrollBottom();
    inScenario = false;
    await delay(500);
    await afterScenarioDone();
  }
}

const SCENARIO_PROMPT_TEXT =
  '（預留）請用文字描述一個與濃縮影片相關的情境，並說明你會怎麼做。';

async function afterScenarioDone() {
  await addBotBubble('謝謝你完成這份問卷！你的回答非常有價值 🙏');
  addEndCard(
    '感謝你的參與！',
    '你的回答對這份研究非常有幫助。<br>資料已匿名記錄，祝你有美好的一天 ☀️',
  );
  disableInput();
  await saveAnswersPayload({ early_exit: '' });
}

async function runInterview() {
  disableInput();
  setProgress(4);
  addSectionLabel('個人基本資料');
  await addBotBubble(
    '嗨！歡迎參與這份問卷 👋\n\n我是訪談助理，想了解大家觀看「濃縮／解說影片」（例如「X 分鐘看完整部劇」）的經驗與想法。\n\n全程約 5–10 分鐘，資料僅供學術研究，匿名處理。準備好的話我們開始囉！',
  );

  answers.gender = await askQuickPick('您的性別？', [
    '女',
    '男',
    '不方便透露',
  ]);
  setProgress(12);

  answers.ntu_student = await askQuickPick('是否為台大學生？', ['是', '否']);
  setProgress(18);

  answers.video_types = await askMulti(
    '你平常會看以下哪些影片類型？（可複選，點選後按「完成選擇」）',
    VIDEO_TYPE_OPTIONS,
    { min: 1 },
  );
  setProgress(26);

  if (!passesVideoTypeGate(answers.video_types)) {
    await finishEarly(
      EARLY_EXIT.VIDEO_TYPE_GATE,
      '了解，你目前較少或未選擇觀看「劇情解說／濃縮影片」類型。依研究設計，我們到這裡先告一段落，仍非常感謝你的時間！',
      '謝謝你！',
      '此路徑不收集後續核心題，已記錄前面的匿名回答。',
    );
    return;
  }

  addSectionLabel('觀看經驗');
  answers.condensed_exposure = await askQuickPick(
    '你有看過影集或電影的濃縮／解說影片嗎？（如「X 分鐘看完整部劇」）',
    ['有，而且滿常看的', '有，但偶爾才看', '沒有'],
  );
  setProgress(38);

  if (answers.condensed_exposure === '沒有') {
    await finishEarly(
      EARLY_EXIT.NO_CONDENSED,
      '了解，這份問卷主要想了解有接觸濃縮／解說影片的經驗，我們先到這裡。非常感謝你的參與！',
      '謝謝你！',
      '已匿名記錄你在前面題目的回答。',
    );
    return;
  }

  answers.subscription = await askQuickPick(
    '你目前有訂閱付費串流平台嗎？（如 Netflix、Disney+、friDay 等）',
    ['有，自己付費訂閱', '有，與家人或朋友共用', '沒有'],
  );
  setProgress(48);

  answers.condensed_frequency = await askQuickPick(
    '你平常看濃縮片的頻率大約是？',
    ['幾乎每天', '一週幾次', '一個月幾次', '很少，但有看過'],
  );
  setProgress(58);

  addSectionLabel('核心題');
  answers.after_condensed = await askQuickPick(
    '看完一部濃縮片後，你通常會怎麼做？',
    [
      AFTER_CONDENSED.FULL,
      AFTER_CONDENSED.PARTIAL,
      AFTER_CONDENSED.NONE,
      AFTER_CONDENSED.IT_DEPENDS,
    ],
  );
  setProgress(68);

  let follow = '';
  if (answers.after_condensed === AFTER_CONDENSED.IT_DEPENDS) {
    follow = await askQuickPick(
      '了解，想再釐清一下：整體來說，哪一種狀況比較常出現？',
      [
        '整體來說，多數時候我會去找原版（完整追完或挑集／片段）',
        '整體來說，多數時候我不會再找原版',
        '兩種狀況差不多，仍很依內容類型',
      ],
    );
    answers.after_condensed_followup = follow;
    setProgress(72);
  }

  const wantOriginal = routesToOriginalReasons(answers.after_condensed, follow);
  const wantNo = routesToNoOriginalReasons(answers.after_condensed, follow);

  await runReasonsBlock(wantOriginal, wantNo);
  setProgress(82);

  addSectionLabel('態度與影響');
  answers.interest_likelihood = await askQuickPick(
    '你認為濃縮片讓你對原版內容產生興趣的機率大約是？',
    [
      '幾乎每次看完都會想去追原版',
      '大約一半的機率會去追',
      '很少，大概不到三成',
      '幾乎不會因此去追原版',
    ],
  );
  setProgress(88);

  answers.subscription_recent = await askQuickPick(
    '過去三個月內，你有沒有因為先看了濃縮片，而後來訂閱或開始使用某個串流平台？',
    ['有', '沒有', '本來就有訂閱，這不影響我的訂閱決定'],
  );
  setProgress(93);

  answers.perceived_effect = await askQuickPick(
    '你覺得濃縮片對你觀看原版內容的影響是？',
    [
      '正面的，讓我更願意去看原版',
      '中性的，不太影響我看不看原版',
      '負面的，讓我覺得不需要再看原版了',
    ],
  );
  setProgress(97);

  if (ENABLE_SCENARIO) {
    addSectionLabel('情境題（可選）');
    await runScenarioIntro(
      '最後是情境題，請用你自己的話回答即可：\n\n' + SCENARIO_PROMPT_TEXT,
    );
    return;
  }

  await afterScenarioDone();
}

async function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;

  if (freeTextResolver) {
    userInput.value = '';
    userInput.style.height = 'auto';
    addUserBubble(text);
    disableInput();
    const fn = freeTextResolver;
    freeTextResolver = null;
    fn(text);
    return;
  }

  userInput.value = '';
  userInput.style.height = 'auto';
  disableInput();

  addUserBubble(text);

  if (inScenario) {
    await handleScenarioReply(text);
  }
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
});

disableInput();
runInterview();
</script>
