<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>濃縮影片消費行為調查</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1A1917;
    --text-secondary: #6B6760;
    --text-muted: #A09D97;
    --accent: #2D6A4F;
    --accent-light: #E8F3EE;
    --accent-mid: #52B788;
    --bubble-bot: #FFFFFF;
    --bubble-user: #2D6A4F;
    --bubble-user-text: #FFFFFF;
    --header-h: 60px;
    --footer-h: 80px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1917;
      --surface: #252320;
      --surface2: #2E2B28;
      --border: rgba(255,255,255,0.08);
      --text-primary: #F0EDE6;
      --text-secondary: #A09D97;
      --text-muted: #6B6760;
      --accent: #52B788;
      --accent-light: #1A2E24;
      --accent-mid: #2D6A4F;
      --bubble-bot: #252320;
      --bubble-user: #2D6A4F;
    }
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-mid);
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--accent-mid);
    transition: width 0.5s ease;
    width: 0%;
  }

  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-track { background: transparent; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .avatar-user {
    background: var(--accent-mid);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
  }

  .bubble {
    max-width: calc(100% - 52px);
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-primary);
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-color: transparent;
    border-bottom-right-radius: 4px;
    border-bottom-left-radius: 18px;
  }

  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }

  .typing-bubble span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .quick-replies {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-left: 42px;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  .multi-actions {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding-left: 42px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .qr-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--accent-mid);
    background: var(--accent-light);
    color: var(--accent);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: normal;
    text-align: left;
    line-height: 1.35;
  }

  .qr-btn:hover {
    background: var(--accent-mid);
    color: #fff;
    border-color: var(--accent-mid);
    transform: translateY(-1px);
  }

  .qr-btn.selected {
    background: var(--accent-mid);
    color: #fff;
    border-color: var(--accent-mid);
  }

  .qr-btn:active { transform: translateY(0); }

  .qr-confirm {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    max-width: 280px;
  }

  .qr-confirm:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  footer {
    height: var(--footer-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #userInput {
    flex: 1;
    padding: 10px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-primary);
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    resize: none;
    transition: border-color 0.15s;
    min-height: 44px;
    max-height: 100px;
    line-height: 1.5;
  }

  #userInput:focus { border-color: var(--accent-mid); }
  #userInput::placeholder { color: var(--text-muted); }
  #userInput:disabled { opacity: 0.4; cursor: not-allowed; }

  #sendBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  #sendBtn:hover { background: var(--accent-mid); transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  #sendBtn svg { width: 18px; height: 18px; }

  .section-label {
    max-width: 640px;
    width: 100%;
    margin: 4px auto;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
  }

  .end-card {
    max-width: 640px;
    width: 100%;
    margin: 8px auto;
    background: var(--accent-light);
    border: 1px solid var(--accent-mid);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  .end-card .icon { font-size: 28px; margin-bottom: 8px; }
  .end-card h2 { font-size: 17px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .end-card p { font-size: 14px; color: var(--text-secondary); }

  .matrix-hint {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding-left: 42px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-dot"></div>
    <h1>濃縮影片消費行為調查</h1>
  </div>
  <div class="progress-bar" id="progressBar"></div>
</header>

<div class="chat-wrap" id="chatWrap"></div>

<footer>
  <div class="input-wrap">
    <textarea id="userInput" placeholder="輸入你的回答…" rows="1" disabled></textarea>
    <button id="sendBtn" disabled aria-label="送出">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</footer>

<script>
/**
 * 分支規則（對齊 question.md）
 *
 * 1) 第 1-1 題：須勾選任一濃縮類型（非「以上都不太看」）才進入核心題。
 * 2) 第 2 題：若 1-1 有勾但第 2 題未選的類型 → Gemini 追問原因（followup_q2）。
 * 3) 第 5 題訂閱：僅在有訂閱時顯示訂閱原因複選。
 * 4) 第 6 題「看情況」→ 釐清後決定第 7／8 題。
 * 5) 第 9 題矩陣：意願最高／最低不同時，先以固定句開場，使用者回覆後再由 Gemini 補充追問。
 * 6) 第 10 題：同上，避免 intro + AI 重複問同一件事。
 */
const BOT_AVATAR = '🎬';
const MAX_TURNS = 2;

const EARLY_EXIT = {
  CONDENSED_GATE: 'condensed_gate',
};

const OPTION_CONDENSED_NONE = '以上都不太看';
const REASON_OTHER = '其他（請簡短說明）';

const CONTENT_TYPES = ['電視劇', '電影', '綜藝', '動漫', '實境秀'];

const CONDENSED_WATCHED_OPTIONS = [
  ...CONTENT_TYPES,
  OPTION_CONDENSED_NONE,
  REASON_OTHER,
];

const STREAMING_WATCH_OPTIONS = [
  '電視劇',
  '電影',
  '綜藝節目',
  '動漫',
  '實境秀',
];

const CONDENSED_SOURCE_OPTIONS = [...CONTENT_TYPES, REASON_OTHER];

const AGE_OPTIONS = ['18 歲以下', '18–25 歲', '26–35 歲', '35 歲以上'];

const FREQUENCY_OPTIONS = [
  '幾乎每天',
  '每週 3–5 次',
  '每週 1–2 次',
  '每月數次',
  '幾乎不看，但過去三個月內有看過',
];

const CONTACT_OPTIONS = [
  '自己主動搜尋特定影集的濃縮版',
  '在社群媒體上滑到（如 YouTube、Facebook 推薦）',
  '朋友或社團分享給我',
  '看到討論後再主動去找來看',
  '其他（請簡短說明）',
];

const SUBSCRIPTION_HAS = ['有，自己付費訂閱', '有，與家人或朋友共用'];

const SUBSCRIPTION_REASON_OPTIONS = [
  '想看特定劇集或電影',
  '家人或朋友推薦',
  '看了濃縮／解說影片後，想看原版內容',
  '朋友邀請共用，分攤費用',
  '其他（請簡短說明）',
];

const WILLINGNESS_OPTIONS = [
  '明顯提升意願',
  '稍微提升意願',
  '沒有影響',
  '稍微降低意願',
  '明顯降低意願',
  '無觀看此類型的濃縮影片',
];

const WILLINGNESS_SCORE = {
  '明顯提升意願': 2,
  '稍微提升意願': 1,
  '沒有影響': 0,
  '稍微降低意願': -1,
  '明顯降低意願': -2,
};

const MATRIX_TYPES = [
  { key: 'drama', label: '影視劇集' },
  { key: 'movie', label: '電影' },
  { key: 'variety', label: '綜藝節目' },
  { key: 'anime', label: '動漫' },
  { key: 'reality', label: '實境秀' },
];

const MATRIX_LABEL_BY_KEY = Object.fromEntries(
  MATRIX_TYPES.map((t) => [t.key, t.label]),
);

const OVERALL_IMPACT_OPTIONS = [
  '明顯提升',
  '稍微提升',
  '沒有影響',
  '稍微降低',
  '明顯降低',
];

const AFTER_CONDENSED = {
  FULL: '去找原版完整追完',
  PARTIAL: '去找原版，但只挑幾集或片段看',
  NONE: '不會再找原版，濃縮版已經夠了',
  IT_DEPENDS: '看情況，要看是什麼類型的內容',
};

const REASONS_ORIGINAL_OPTIONS = [
  '濃縮版讓我對劇情更有興趣，想完整體驗',
  '想看更多細節或情感鋪陳',
  '身邊朋友也在看，想一起討論',
  '濃縮版畫質或剪接不夠好，想看原版',
  REASON_OTHER,
];

const REASONS_NO_ORIGINAL_OPTIONS = [
  '濃縮版看完就知道劇情了，不需要再看',
  '沒有時間看完整版',
  '沒有訂閱平台或取得管道',
  '看完濃縮版後對這部劇的興趣反而降低了',
  REASON_OTHER,
];

let answers = {};
let aiFollowupState = null;
let aiFollowupDone = null;
let freeTextResolver = null;

const chatWrap = document.getElementById('chatWrap');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const progressBar = document.getElementById('progressBar');

function setProgress(p) {
  progressBar.style.width = Math.min(100, Math.max(0, p)) + '%';
}

function delay(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

function passesCondensedGate(types) {
  if (!Array.isArray(types) || types.includes(OPTION_CONDENSED_NONE)) return false;
  return CONTENT_TYPES.some((t) => types.includes(t));
}

function getDroppedCondensedTypes() {
  const watched = answers.condensed_watched_types || [];
  const current = answers.condensed_source_types || [];
  return CONTENT_TYPES.filter((t) => watched.includes(t) && !current.includes(t));
}

function hasSubscription(choice) {
  return SUBSCRIPTION_HAS.includes(choice);
}

function createRow(who, text, isTyping = false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (who === 'user' ? ' user' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (who === 'user' ? ' avatar-user' : '');
  avatar.textContent = who === 'user' ? 'ME' : BOT_AVATAR;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = String(text).replace(/\n/g, '<br>');
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  return row;
}

function scrollBottom() {
  setTimeout(() => {
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }, 50);
}

function addUserBubble(text) {
  const row = createRow('user', text);
  chatWrap.appendChild(row);
  scrollBottom();
}

function addBotBubble(text, withTyping = true) {
  return new Promise((resolve) => {
    if (withTyping) {
      const typingRow = createRow('bot', null, true);
      chatWrap.appendChild(typingRow);
      scrollBottom();
      setTimeout(() => {
        typingRow.remove();
        const row = createRow('bot', text);
        chatWrap.appendChild(row);
        scrollBottom();
        resolve();
      }, 900 + Math.random() * 400);
    } else {
      const row = createRow('bot', text);
      chatWrap.appendChild(row);
      scrollBottom();
      resolve();
    }
  });
}

function addSectionLabel(label) {
  const el = document.createElement('div');
  el.className = 'section-label';
  el.textContent = '── ' + label + ' ──';
  chatWrap.appendChild(el);
  scrollBottom();
}

function addQuickReplies(options, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';

  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      wrap.remove();
      onSelect(opt);
    });
    wrap.appendChild(btn);
  });

  chatWrap.appendChild(wrap);
  scrollBottom();
}

function addMultiReplies(options, { min = 1, exclusiveNone = null } = {}) {
  return new Promise((resolve) => {
    const selected = new Set();
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';

    const toggle = (label) => {
      if (exclusiveNone && label === exclusiveNone) {
        if (selected.has(exclusiveNone)) selected.delete(exclusiveNone);
        else {
          selected.clear();
          selected.add(exclusiveNone);
        }
      } else {
        if (exclusiveNone) selected.delete(exclusiveNone);
        if (selected.has(label)) selected.delete(label);
        else selected.add(label);
      }
      syncStyles();
    };

    const syncStyles = () => {
      buttons.forEach(({ label, el }) => {
        el.classList.toggle('selected', selected.has(label));
      });
      confirmBtn.disabled = selected.size < min;
    };

    const buttons = [];
    options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qr-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => toggle(opt, btn));
      wrap.appendChild(btn);
      buttons.push({ label: opt, el: btn });
    });

    const actions = document.createElement('div');
    actions.className = 'multi-actions';
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'qr-confirm';
    confirmBtn.textContent = '完成選擇';
    confirmBtn.disabled = true;
    confirmBtn.addEventListener('click', () => {
      wrap.remove();
      actions.remove();
      resolve([...selected]);
    });
    actions.appendChild(confirmBtn);

    chatWrap.appendChild(wrap);
    chatWrap.appendChild(actions);
    scrollBottom();
  });
}

async function askQuickPick(text, options) {
  await addBotBubble(text);
  return new Promise((resolve) => {
    addQuickReplies(options, async (sel) => {
      addUserBubble(sel);
      await delay(280);
      resolve(sel);
    });
  });
}

async function askMulti(text, options, opts) {
  await addBotBubble(text);
  const picked = await addMultiReplies(options, opts);
  addUserBubble(picked.join('、'));
  await delay(280);
  return picked;
}

async function askOtherSupplement(selection, otherLabel, answerKey) {
  if (!selection.includes(otherLabel)) return;
  await addBotBubble('你選擇了「其他」，請用一句話簡短補充（若不方便填寫可輸入「無」）。');
  const extra = await waitForFreeText();
  answers[answerKey] = extra.trim();
}

function waitForFreeText() {
  return new Promise((resolve) => {
    freeTextResolver = (text) => {
      disableInput();
      resolve(text);
    };
    userInput.placeholder = '輸入補充說明…';
    enableInput();
  });
}

function enableInput() {
  userInput.disabled = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function disableInput() {
  userInput.disabled = true;
  sendBtn.disabled = true;
  userInput.placeholder = '輸入你的回答…';
}

async function finishEarly(exitCode, botLines, endTitle, endBody) {
  await addBotBubble(botLines);
  addEndCard(endTitle, endBody);
  disableInput();
  await saveAnswersPayload({ early_exit: exitCode });
}

function addEndCard(title, bodyHtml) {
  const card = document.createElement('div');
  card.className = 'end-card';
  card.innerHTML =
    '<div class="icon">🎉</div><h2>' +
    title +
    '</h2><p>' +
    bodyHtml +
    '</p>';
  chatWrap.appendChild(card);
  scrollBottom();
}

function formatAnswersForPrompt() {
  const lines = [];
  const push = (k, v) => {
    if (v == null || v === '') return;
    if (Array.isArray(v)) {
      if (v.length) lines.push(`- ${k}：${v.join('、')}`);
    } else if (typeof v === 'object') {
      lines.push(`- ${k}：${JSON.stringify(v)}`);
    } else {
      lines.push(`- ${k}：${v}`);
    }
  };
  push('性別', answers.gender);
  push('年齡', answers.age);
  push('是否台大學生', answers.ntu_student);
  push('曾看過的濃縮類型(1-1)', answers.condensed_watched_types);
  push('串流/電視觀看類型(1-2)', answers.streaming_watch_types);
  push('目前主要濃縮類型(2)', answers.condensed_source_types);
  push('濃縮片觀看頻率', answers.condensed_frequency);
  push('接觸濃縮片的方式', answers.contact_channels);
  push('串流訂閱狀況', answers.subscription);
  push('訂閱主要原因', answers.subscription_reasons);
  push('看完濃縮片後通常', answers.after_condensed);
  push('看情況時的補充', answers.after_condensed_followup);
  push('有去找原版的原因', answers.reasons_original);
  push('沒有去找原版的原因', answers.reasons_no_original);
  if (answers.willingness_by_type) {
    Object.entries(answers.willingness_by_type).forEach(([key, val]) => {
      const label = MATRIX_LABEL_BY_KEY[key] || key;
      lines.push(`- 第9題 ${label}：${val}`);
    });
  }
  push('整體意願影響', answers.overall_willingness_impact);
  return lines.join('\n');
}

function buildFollowupSystemPrompt(topicInstruction, turn, maxTurns) {
  return `你是一個問卷訪談助理，正在進行「濃縮影片消費行為」的研究訪談。

受訪者目前已填答的內容：
${formatAnswersForPrompt()}

你現在要進行的追問任務：
${topicInstruction}

規則：
1. 語氣輕鬆、自然，像朋友在聊天，使用繁體中文。
2. 每次只問一個追問，不要一次問很多問題。
3. 追問必須與受訪者先前的答案相關，可引用具體選項。
4. 若受訪者已充分說明原因，直接收尾，不要硬追。
5. 最多追問 ${maxTurns} 輪；目前是第 ${turn} 輪（使用者剛完成一則回覆後計數）。
6. 不能評價受訪者的答案。
7. 不能討論與問卷無關的話題。
8. 收尾時說「謝謝你的分享！」並在訊息最後輸出 [END]。
9. 若回覆太短，可溫和邀請多說一點。
10. 不要重複已經問過的問題；開場白已由系統顯示，直接接續對話即可。`;
}

async function callGemini(systemPrompt, messages) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system: systemPrompt, messages }),
  });
  const data = await response.json();
  return (
    data?.candidates?.[0]?.content?.parts?.[0]?.text ||
    data?.content?.[0]?.text ||
    '謝謝你的分享！[END]'
  );
}

async function saveAnswersPayload({ early_exit }) {
  const payload = {
    timestamp: new Date().toISOString(),
    early_exit: early_exit || '',
    answers: { ...answers },
    followups: {
      q2: answers.followup_q2 || null,
      q9: answers.followup_q9 || null,
      q10: answers.followup_q10 || null,
    },
  };

  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      console.warn('save failed', res.status, err);
    }
  } catch (e) {
    console.warn('save error', e);
  }
}

function routesToOriginalReasons(choice, followup) {
  if (choice === AFTER_CONDENSED.FULL || choice === AFTER_CONDENSED.PARTIAL)
    return true;
  if (choice === AFTER_CONDENSED.NONE) return false;
  if (choice === AFTER_CONDENSED.IT_DEPENDS) {
    if (followup === '兩種狀況差不多，仍很依內容類型') return true;
    return (
      followup ===
      '整體來說，多數時候我會去找原版（完整追完或挑集／片段）'
    );
  }
  return false;
}

function routesToNoOriginalReasons(choice, followup) {
  if (choice === AFTER_CONDENSED.NONE) return true;
  if (choice === AFTER_CONDENSED.FULL || choice === AFTER_CONDENSED.PARTIAL)
    return false;
  if (choice === AFTER_CONDENSED.IT_DEPENDS) {
    if (followup === '兩種狀況差不多，仍很依內容類型') return true;
    return followup === '整體來說，多數時候我不會再找原版';
  }
  return false;
}

async function runReasonsBlock(wantOriginal, wantNoOriginal) {
  if (wantOriginal) {
    await addBotBubble(
      '承上題，如果你「有去找原版來看」，最主要的原因是？（可複選，按「完成選擇」送出）',
    );
    const sel = await addMultiReplies(REASONS_ORIGINAL_OPTIONS, { min: 1 });
    addUserBubble(sel.join('、'));
    answers.reasons_original = sel;
    await askOtherSupplement(sel, REASON_OTHER, 'reasons_original_other');
    await delay(300);
  }

  if (wantNoOriginal) {
    await addBotBubble(
      '如果你「沒有去找原版來看」，最主要的原因是？（可複選，按「完成選擇」送出）',
    );
    const sel2 = await addMultiReplies(REASONS_NO_ORIGINAL_OPTIONS, { min: 1 });
    addUserBubble(sel2.join('、'));
    answers.reasons_no_original = sel2;
    await askOtherSupplement(sel2, REASON_OTHER, 'reasons_no_original_other');
    await delay(300);
  }
}

function getMatrixExtremes(matrix) {
  const entries = Object.entries(matrix || {})
    .filter(([, v]) => v && v !== '無觀看此類型的濃縮影片')
    .map(([key, value]) => ({
      key,
      label: MATRIX_LABEL_BY_KEY[key] || key,
      value,
      score: WILLINGNESS_SCORE[value] ?? 0,
    }));

  if (!entries.length) return { highest: null, lowest: null, skip: true };

  let highest = entries[0];
  let lowest = entries[0];
  for (const e of entries) {
    if (e.score > highest.score) highest = e;
    if (e.score < lowest.score) lowest = e;
  }
  if (highest.score === lowest.score && entries.length === 1) {
    return { highest, lowest: null, skip: false, single: true };
  }
  if (highest.score === lowest.score) {
    return { highest, lowest: null, skip: true };
  }
  return { highest, lowest, skip: false, single: false };
}

async function askWillingnessMatrix() {
  answers.willingness_by_type = {};
  await addBotBubble(
    '以下不同類型的內容，濃縮片對您去找原版觀看的意願影響分別是？\n請針對每種內容類型選擇最符合您狀況的選項。\n\n選項：明顯提升意願／稍微提升意願／沒有影響／稍微降低意願／明顯降低意願／無觀看此類型的濃縮影片',
  );

  for (const t of MATRIX_TYPES) {
    const val = await askQuickPick(`【${t.label}】`, WILLINGNESS_OPTIONS);
    answers.willingness_by_type[t.key] = val;
  }
}

function finishAiFollowupSession() {
  if (aiFollowupDone) {
    const done = aiFollowupDone;
    aiFollowupDone = null;
    done();
  }
}

async function startAiFollowup({ firstQuestion, topicInstruction, storageKey }) {
  return new Promise(async (resolve) => {
    aiFollowupDone = resolve;
    aiFollowupState = {
      topicInstruction,
      storageKey,
      history: [],
      turns: 0,
      maxTurns: MAX_TURNS,
    };
    await addBotBubble(firstQuestion);
    aiFollowupState.history.push({ role: 'assistant', content: firstQuestion });
    enableInput();
  });
}

async function handleAiFollowupReply(userText) {
  if (!aiFollowupState) return;

  aiFollowupState.history.push({ role: 'user', content: userText });
  aiFollowupState.turns++;
  disableInput();

  const typingRow = createRow('bot', null, true);
  chatWrap.appendChild(typingRow);
  scrollBottom();

  try {
    const systemPrompt = buildFollowupSystemPrompt(
      aiFollowupState.topicInstruction,
      aiFollowupState.turns,
      aiFollowupState.maxTurns,
    );
    const replyText = await callGemini(
      systemPrompt,
      aiFollowupState.history,
    );
    typingRow.remove();

    const isEnd =
      replyText.includes('[END]') ||
      aiFollowupState.turns >= aiFollowupState.maxTurns;
    const cleanReply = replyText.replace(/\[END\]/g, '').trim();

    const row = createRow('bot', cleanReply);
    chatWrap.appendChild(row);
    scrollBottom();

    aiFollowupState.history.push({ role: 'assistant', content: cleanReply });
    answers[aiFollowupState.storageKey] = [...aiFollowupState.history];

    if (isEnd) {
      aiFollowupState = null;
      finishAiFollowupSession();
    } else {
      enableInput();
    }
  } catch (err) {
    typingRow.remove();
    const row = createRow('bot', '謝謝你的分享！🙏');
    chatWrap.appendChild(row);
    scrollBottom();
    if (aiFollowupState) {
      answers[aiFollowupState.storageKey] = [...aiFollowupState.history];
      aiFollowupState = null;
    }
    finishAiFollowupSession();
  }
}

async function runQ9AiFollowup() {
  const { highest, lowest, skip, single } = getMatrixExtremes(
    answers.willingness_by_type,
  );
  if (skip || !highest) return;

  let topic;
  if (single || !lowest) {
    topic = `受訪者在第9題對「${highest.label}」選擇了「${highest.value}」。請追問：為什麼濃縮片對這類內容產生這樣的影響？`;
  } else {
    topic = `受訪者在第9題中：
- 對「${highest.label}」選擇「${highest.value}」（相對最願意去找原版）
- 對「${lowest.label}」選擇「${lowest.value}」（相對最不願意去找原版）
請先就意願較高的類型追問原因；若還有追問輪次，再簡短詢問意願較低類型的原因。`;
  }

  const firstQuestion =
    single || !lowest
      ? `你對「${highest.label}」選了「${highest.value}」。方便說說為什麼濃縮片會讓你對這類內容有這樣的影響嗎？`
      : `你對「${highest.label}」選了「${highest.value}」，對「${lowest.label}」則是「${lowest.value}」。想先請你談談，為什麼對「${highest.label}」會有這樣的影響？`;

  await startAiFollowup({
    firstQuestion,
    topicInstruction: topic,
    storageKey: 'followup_q9',
  });
}

async function runQ2DroppedFollowup() {
  const dropped = getDroppedCondensedTypes();
  if (!dropped.length) return;

  const topic = `受訪者在第1-1題表示曾看過：${(answers.condensed_watched_types || []).join('、')}，但在第2題「目前主要觀看的濃縮類型」未選：${dropped.join('、')}。請追問為什麼目前沒有繼續觀看這些類型的濃縮影片。`;
  const firstQuestion = `你在前面提到曾看過「${dropped.join('、')}」的濃縮影片，但現在主要觀看的類型裡沒有選這幾項。方便說說為什麼目前比較少看這些類型嗎？`;

  await startAiFollowup({
    firstQuestion,
    topicInstruction: topic,
    storageKey: 'followup_q2',
  });
}

async function runQ10AiFollowup() {
  const impact = answers.overall_willingness_impact;
  const firstQuestion = `你選擇整體影響為「${impact}」。能說說為什麼會這樣覺得嗎？`;
  await startAiFollowup({
    firstQuestion,
    topicInstruction: `受訪者認為整體而言，觀看濃縮片對想看原版內容的意願影響是「${impact}」。使用者已回答第一輪後，可簡短補充追問或收尾；不要重複同一個問題。`,
    storageKey: 'followup_q10',
  });
}

async function afterScenarioDone() {
  await addBotBubble('謝謝你完成這份問卷！你的回答非常有價值 🙏');
  addEndCard(
    '感謝你的參與！',
    '你的回答對這份研究非常有幫助。<br>資料已匿名記錄，祝你有美好的一天 ☀️',
  );
  disableInput();
  await saveAnswersPayload({ early_exit: '' });
}

async function runInterview() {
  disableInput();
  setProgress(4);
  addSectionLabel('個人基本資料');
  await addBotBubble(
    '嗨！歡迎參與這份問卷 👋\n\n我是訪談助理，想了解濃縮／解說影片對正版影集觀看意願的影響。\n\n全程約 8–12 分鐘，資料僅供學術研究，匿名處理。準備好的話我們開始囉！',
  );

  answers.gender = await askQuickPick('您的性別？', [
    '女',
    '男',
    '不方便透露',
  ]);
  setProgress(8);

  answers.age = await askQuickPick('您的年齡？', AGE_OPTIONS);
  setProgress(14);

  answers.ntu_student = await askQuickPick('您是否為台大學生？', ['是', '否']);
  setProgress(18);

  answers.condensed_watched_types = await askMulti(
    '您曾看過以下哪些類型的濃縮影片？（可複選）',
    CONDENSED_WATCHED_OPTIONS,
    { min: 1, exclusiveNone: OPTION_CONDENSED_NONE },
  );
  await askOtherSupplement(
    answers.condensed_watched_types,
    REASON_OTHER,
    'condensed_watched_other',
  );
  setProgress(26);

  if (!passesCondensedGate(answers.condensed_watched_types)) {
    await finishEarly(
      EARLY_EXIT.CONDENSED_GATE,
      '了解，你目前未選擇曾看過的濃縮影片類型。依研究設計，我們到這裡先告一段落，仍非常感謝你的時間！',
      '謝謝你！',
      '此路徑不收集後續核心題，已記錄前面的匿名回答。',
    );
    return;
  }

  answers.streaming_watch_types = await askMulti(
    '您平常會於串流平台／電視上觀看以下哪些影片？（可複選）',
    STREAMING_WATCH_OPTIONS,
    { min: 1 },
  );
  setProgress(32);

  addSectionLabel('觀看習慣');
  answers.condensed_source_types = await askMulti(
    '您目前觀看的濃縮／解說影片，主要是哪些類原版內容的濃縮？（可複選）',
    CONDENSED_SOURCE_OPTIONS,
    { min: 1 },
  );
  await askOtherSupplement(
    answers.condensed_source_types,
    REASON_OTHER,
    'condensed_source_other',
  );
  setProgress(40);

  await runQ2DroppedFollowup();
  setProgress(46);

  answers.condensed_frequency = await askQuickPick(
    '你平常看濃縮片的頻率大約是？',
    FREQUENCY_OPTIONS,
  );
  setProgress(42);

  answers.contact_channels = await askMulti(
    '您通常是透過什麼方式接觸到濃縮影片的？（可複選）',
    CONTACT_OPTIONS,
    { min: 1 },
  );
  await askOtherSupplement(
    answers.contact_channels,
    '其他（請簡短說明）',
    'contact_channels_other',
  );
  setProgress(50);

  answers.subscription = await askQuickPick(
    '你目前有訂閱付費串流平台嗎？（如 Netflix、Disney+、friDay 等）',
    ['有，自己付費訂閱', '有，與家人或朋友共用', '沒有'],
  );
  setProgress(56);

  if (hasSubscription(answers.subscription)) {
    answers.subscription_reasons = await askMulti(
      '承上題，您訂閱串流平台的主要原因是？（可複選）',
      SUBSCRIPTION_REASON_OPTIONS,
      { min: 1 },
    );
    await askOtherSupplement(
      answers.subscription_reasons,
      '其他（請簡短說明）',
      'subscription_reasons_other',
    );
  }
  setProgress(62);

  addSectionLabel('核心題');
  answers.after_condensed = await askQuickPick(
    '看完一部濃縮片後，你通常會怎麼做？',
    [
      AFTER_CONDENSED.FULL,
      AFTER_CONDENSED.PARTIAL,
      AFTER_CONDENSED.NONE,
      AFTER_CONDENSED.IT_DEPENDS,
    ],
  );
  setProgress(70);

  let follow = '';
  if (answers.after_condensed === AFTER_CONDENSED.IT_DEPENDS) {
    follow = await askQuickPick(
      '了解，想再釐清一下：整體來說，哪一種狀況比較常出現？',
      [
        '整體來說，多數時候我會去找原版（完整追完或挑集／片段）',
        '整體來說，多數時候我不會再找原版',
        '兩種狀況差不多，仍很依內容類型',
      ],
    );
    answers.after_condensed_followup = follow;
  }

  const wantOriginal = routesToOriginalReasons(answers.after_condensed, follow);
  const wantNo = routesToNoOriginalReasons(answers.after_condensed, follow);
  await runReasonsBlock(wantOriginal, wantNo);
  setProgress(78);

  addSectionLabel('態度與影響');
  await askWillingnessMatrix();
  setProgress(86);

  await runQ9AiFollowup();
  setProgress(92);

  answers.overall_willingness_impact = await askQuickPick(
    '整體而言，觀看濃縮片對您想看原版內容的意願影響是？',
    OVERALL_IMPACT_OPTIONS,
  );
  setProgress(96);

  await runQ10AiFollowup();
  setProgress(100);

  await afterScenarioDone();
}

async function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;

  if (freeTextResolver) {
    userInput.value = '';
    userInput.style.height = 'auto';
    addUserBubble(text);
    disableInput();
    const fn = freeTextResolver;
    freeTextResolver = null;
    fn(text);
    return;
  }

  userInput.value = '';
  userInput.style.height = 'auto';
  disableInput();

  addUserBubble(text);

  if (aiFollowupState) {
    await handleAiFollowupReply(text);
  }
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
});

disableInput();
runInterview();
