<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>影音平台觀看行為研究 | AI 訪談 Agent</title>
    <style>
        :root { --primary: #1D9E75; --bg: #f4f7f6; }
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg); }
        #sidebar { width: 280px; background: #2c3e50; color: white; padding: 20px; box-sizing: border-box; }
        #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
        .ai { align-self: flex-start; background: white; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user { align-self: flex-end; background: var(--primary); color: white; }
        #input-zone { padding: 20px; background: white; border-top: 1px solid #ddd; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 25px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--primary); color: white; }
        .hidden { display: none !important; }
        .error-text { color: #e74c3c; font-weight: bold; background: #fdf2f2; border: 1px solid #e74c3c; }
        #timer { font-size: 20px; color: #f1c40f; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<div id="sidebar">
    <h3>訪談狀態</h3>
    <div id="timer">剩餘時間：60:00</div>
    <hr style="opacity: 0.3;">
    <p>研究對象：18-35歲影音用戶</p>
    <p style="font-size: 12px; color: #bdc3c7;">目標：分析濃縮影片之導流與侵蝕效應</p>
    <hr style="opacity: 0.3;">
    <button id="export-btn" onclick="exportTranscript()" style="display:none; width:100%; background:#95a5a6; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer;">匯出逐字稿</button>
</div>
<div id="chat-area">
    <div id="messages"></div>
    <div id="input-zone">
        <div id="button-group" class="btn-group hidden"></div>
        <div id="text-input-group" class="hidden" style="display: flex; align-items: center;">
            <input type="text" id="user-input" style="flex: 1; padding:12px; border-radius:8px; border:1px solid #ddd;" placeholder="請輸入您的回答...">
            <button onclick="sendTextToAI()" style="margin-left:8px;">送出</button>
            <button onclick="saveToDatabase()" style="margin-left:8px; background:#e74c3c; border-color:#e74c3c; color:white;">結束並上傳</button>
        </div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('admin') === '1') {
    document.getElementById('export-btn').style.display = 'block';
}

// --- 計時器邏輯 ---
let timeLeft = 3600; // 60 分鐘 = 3600 秒
let timerActive = false;

function startTimer() {
    if (timerActive) return;
    timerActive = true;
    const timerDisplay = document.getElementById('timer');
    const interval = setInterval(() => {
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        timerDisplay.innerText = `剩餘時間：${mins}:${secs < 10 ? '0' : ''}${secs}`;
        
        if (timeLeft <= 0) {
            clearInterval(interval);
            forceEndInterview();
        }
        timeLeft--;
    }, 1000);
}

function forceEndInterview() {
    alert("訪談時間已達 60 分鐘，系統將自動結束。請點擊「確定」後上傳您的紀錄。");
    document.getElementById('text-input-group').classList.add('hidden');
    document.getElementById('button-group').classList.add('hidden');
    appendMsg('ai', "【系統通知】訪談時間已結束，請點擊右下角「結束並上傳」按鈕以完成流程。");
}

// --- 第一階段：固定腳本設定 ---
const FIXED_QUESTIONS = [
    { id: "Q1", text: "請問您的年齡區間是？", options: ["18 歲以下", "18–25 歲", "26–35 歲"] },
    { id: "Q2", text: "平時看影片的習慣偏向？", options: ["完整劇集", "完整電影", "劇情解說／濃縮影片", "兩者都會看"] },
    { id: "Q3", text: "請問是否有訂閱付費平台？", options: ["有，自己付費", "有，和人共用", "沒有"] },
    { id: "Q4", text: "您觀看「濃縮影片」的頻率大約是？", options: ["幾乎每天", "一週幾次", "一個月幾次", "很少看", "幾乎不看"] }
];

let currentFixedStep = -1; 
let collectedProfile = []; 
let chatHistory = [];      
let fullTranscript = [];   

function appendMsg(role, text, isError = false) {
    const m = document.getElementById('messages');
    const d = document.createElement('div');
    d.className = `bubble ${role} ${isError ? 'error-text' : ''}`;
    d.innerText = text;
    m.appendChild(d);
    m.scrollTop = m.scrollHeight;
    if (!isError) fullTranscript.push(`${role === 'user' ? '【受訪者】' : '【訪談員】'}\n${text}`);
}

function showButtons(options, callback) {
    const btnGroup = document.getElementById('button-group');
    btnGroup.innerHTML = '';
    options.forEach(opt => {
        const b = document.createElement('button');
        b.innerText = opt;
        b.onclick = () => callback(opt);
        btnGroup.appendChild(b);
    });
    btnGroup.classList.remove('hidden');
}

function hideButtons() {
    document.getElementById('button-group').classList.add('hidden');
}

function handleFixedAnswer(answer) {
    appendMsg('user', answer);
    hideButtons();
    if (currentFixedStep === -1) {
        if (answer === "不同意") {
            appendMsg('ai', "好的，感謝您的時間，本次訪談到此結束。");
            return;
        }
        // 同意後立刻開始倒數計時
        startTimer();
        currentFixedStep = 0;
        askNextFixedQuestion();
    } else {
        let qText = FIXED_QUESTIONS[currentFixedStep].text;
        collectedProfile.push(`- ${qText}：${answer}`);
        currentFixedStep++;
        askNextFixedQuestion();
    }
}

function askNextFixedQuestion() {
    if (currentFixedStep < FIXED_QUESTIONS.length) {
        let nextQ = FIXED_QUESTIONS[currentFixedStep];
        setTimeout(() => {
            appendMsg('ai', nextQ.text);
            showButtons(nextQ.options, handleFixedAnswer);
        }, 500); 
    } else {
        transitionToAI();
    }
}

// --- 第二階段：交接點 ---
const PROMPT = `你是一位專業的研究員。核心目標：探討濃縮影片對正版內容的影響。
1. 深入挖掘受訪者看完濃縮片後，是否會去找原版。
2. 語氣自然，一次只問一題。
3. 嚴禁偏離主題聊劇情，重點在觀看決策。`;

async function transitionToAI() {
    appendMsg('ai', "感謝您的回答！接下來我想深入聊聊您對「濃縮影片」與「原版影劇」的具體看法...");
    let handoverPrompt = `【受訪者基本資料】\n${collectedProfile.join('\n')}\n\n請根據背景開始提問第一個開放式問題。`;
    chatHistory.push({ role: "user", parts: [{ text: handoverPrompt }] });
    await fetchAIResponse();
}

// --- 第三階段：AI 訪談 (含延遲防爆) ---
async function sendTextToAI() {
    const val = document.getElementById('user-input').value;
    if(!val || timeLeft <= 0) return;
    appendMsg('user', val);
    document.getElementById('user-input').value = '';
    chatHistory.push({ role: "user", parts: [{ text: val }] });
    await fetchAIResponse();
}

async function fetchAIResponse() {
    document.getElementById('text-input-group').classList.add('hidden');
    const m = document.getElementById('messages');
    const loadingDiv = document.createElement('div');
    loadingDiv.className = `bubble ai`;
    loadingDiv.id = 'loading-msg';
    loadingDiv.innerText = "訪談員思考中...";
    m.appendChild(loadingDiv);
    m.scrollTop = m.scrollHeight;

    await new Promise(resolve => setTimeout(resolve, 4000));

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                system_instruction: { parts: [{ text: PROMPT }] }, 
                contents: chatHistory 
            })
        });
        const data = await res.json();
        if (document.getElementById('loading-msg')) document.getElementById('loading-msg').remove();

        if (data.error) {
            appendMsg('ai', `連線異常，請稍後再試。`, true);
        } else if (data.candidates && data.candidates[0].content) {
            const aiMsg = data.candidates[0].content.parts[0].text;
            appendMsg('ai', aiMsg);
            chatHistory.push({ role: "model", parts: [{ text: aiMsg }] });
        }
    } catch (e) {
        if (document.getElementById('loading-msg')) document.getElementById('loading-msg').remove();
        appendMsg('ai', `系統繁忙。`, true);
    }
    
    // 如果時間還沒到，才恢復輸入框
    if (timeLeft > 0) {
        document.getElementById('text-input-group').classList.remove('hidden');
        document.getElementById('text-input-group').style.display = 'flex';
    }
}

function exportTranscript() {
    let t = "訪談逐字稿\n" + "=".repeat(20) + "\n\n" + fullTranscript.join('\n\n---\n\n');
    const blob = new Blob([t], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'transcript.txt';
    a.click();
}

async function saveToDatabase() {
    const payload = { time: new Date().toLocaleString(), transcript: fullTranscript.join('\n\n') };
    const webhookUrl = "你的_WEBHOOK_網址請貼在這裡"; 
    try {
        const btn = document.querySelectorAll('#text-input-group button')[1];
        btn.innerText = "傳送中...";
        btn.disabled = true;
        const res = await fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (res.ok) { alert('訪談紀錄已成功上傳！'); btn.innerText = "已上傳"; }
        else { alert('上傳失敗'); btn.innerText = "結束並上傳"; btn.disabled = false; }
    } catch (e) { alert('尚未設定 Webhook'); }
}

setTimeout(() => {
    appendMsg('ai', "您好！感謝參與研究。本次訪談皆採匿名進行，資料僅供本課程分析所用。請問您是否同意開始訪談？");
    showButtons(["同意", "不同意"], handleFixedAnswer);
}, 500);
</script>
</body>
</html>
