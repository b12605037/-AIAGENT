<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>濃縮影片消費行為調查</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1A1917;
    --text-secondary: #6B6760;
    --text-muted: #A09D97;
    --accent: #2D6A4F;
    --accent-light: #E8F3EE;
    --accent-mid: #52B788;
    --bubble-bot: #FFFFFF;
    --bubble-user: #2D6A4F;
    --bubble-user-text: #FFFFFF;
    --header-h: 60px;
    --footer-h: 80px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1917;
      --surface: #252320;
      --surface2: #2E2B28;
      --border: rgba(255,255,255,0.08);
      --text-primary: #F0EDE6;
      --text-secondary: #A09D97;
      --text-muted: #6B6760;
      --accent: #52B788;
      --accent-light: #1A2E24;
      --accent-mid: #2D6A4F;
      --bubble-bot: #252320;
      --bubble-user: #2D6A4F;
    }
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-mid);
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--accent-mid);
    transition: width 0.5s ease;
    width: 0%;
  }

  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-track { background: transparent; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .avatar-user {
    background: var(--accent-mid);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
  }

  .bubble {
    max-width: calc(100% - 52px);
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-primary);
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-color: transparent;
    border-bottom-right-radius: 4px;
    border-bottom-left-radius: 18px;
  }

  .typing-bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }

  .typing-bubble span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .quick-replies {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-left: 42px;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  .multi-actions {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding-left: 42px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .qr-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--accent-mid);
    background: var(--accent-light);
    color: var(--accent);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: normal;
    text-align: left;
    line-height: 1.35;
  }

  .qr-btn:hover {
    background: var(--accent-mid);
    color: #fff;
    border-color: var(--accent-mid);
    transform: translateY(-1px);
  }

  .qr-btn.selected {
    background: var(--accent-mid);
    color: #fff;
    border-color: var(--accent-mid);
  }

  .qr-btn:active { transform: translateY(0); }

  .qr-confirm {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    max-width: 280px;
  }

  .qr-confirm:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  footer {
    height: var(--footer-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
  }

  .input-wrap {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #userInput {
    flex: 1;
    padding: 10px 16px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-primary);
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    resize: none;
    transition: border-color 0.15s;
    min-height: 44px;
    max-height: 100px;
    line-height: 1.5;
  }

  #userInput:focus { border-color: var(--accent-mid); }
  #userInput::placeholder { color: var(--text-muted); }
  #userInput:disabled { opacity: 0.4; cursor: not-allowed; }

  #sendBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  #sendBtn:hover { background: var(--accent-mid); transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  #sendBtn svg { width: 18px; height: 18px; }

  .section-label {
    max-width: 640px;
    width: 100%;
    margin: 4px auto;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
  }

  .end-card {
    max-width: 640px;
    width: 100%;
    margin: 8px auto;
    background: var(--accent-light);
    border: 1px solid var(--accent-mid);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  .end-card .icon { font-size: 28px; margin-bottom: 8px; }
  .end-card h2 { font-size: 17px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .end-card p { font-size: 14px; color: var(--text-secondary); }

  .matrix-hint {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding-left: 42px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-dot"></div>
    <h1>濃縮影片消費行為調查</h1>
  </div>
  <div class="progress-bar" id="progressBar"></div>
</header>

<div class="chat-wrap" id="chatWrap"></div>

<footer>
  <div class="input-wrap">
    <textarea id="userInput" placeholder="輸入你的回答…" rows="1" disabled></textarea>
    <button id="sendBtn" disabled aria-label="送出">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</footer>

<script>
/**
 * 分支規則（對齊 question-new.md）
 * 篩選「是否看過濃縮影片」→ 否則結束
 * 第2題「視作品種類而定」、第3-1.1「視影視作品種類而異」→ Gemini 追問
 * 第3題複選後依內部分類分支 → 3-1.1 / 3-2.1 / 3-2.2（介面不顯示分類標籤）
 * 問卷本體答完先寫入試算表，email 選填可事後更新同一列
 */
const BOT_AVATAR = '🎬';
const MAX_FOLLOWUP_REPLIES = 3;

const EARLY_EXIT = {
  SCREENING_NO: 'screening_no',
};

const REASON_OTHER = '其他（請簡短說明）';

const INTRO_TEXT =
  '嗨！歡迎參與問卷 👋\n\n' +
  '【濃縮影片定義】\n' +
  '由第三方創作者（非官方）將原有影集、電視劇或電影的畫面，透過二次剪輯與再製（如加入旁白、解說、重新編排順序與加入個人心得等），製作成短時長影片。\n\n' +
  '【本問卷所指】\n' +
  '同上，例如「X 分鐘看完某劇」、谷阿莫等創作者的解說影片。\n' +
  '△ 不含影視作品花絮、官方預告片等官方內容。\n\n' +
  '【調查目標】\n' +
  '了解 18–35 歲受眾觀看完濃縮影片後的後續行為，以及這些行為對正版影視內容是促進還是侵蝕。\n\n' +
  '資料僅供學術研究、匿名處理。';

const Q1_TYPE_OPTIONS = [
  '電視劇 / 劇集',
  '電影',
  '綜藝（含實境秀，如黑白大廚、Running man…）',
  REASON_OTHER,
];

const Q2_MOTIVATION_OPTIONS = [
  '想先篩選原版是否值得花時間觀看',
  '沒有時間看原版，但想了解劇情',
  '演算法推薦，被動接觸',
  '原版已看過，想重溫重點',
  '視作品種類而定',
  REASON_OTHER,
];
const Q2_DEPENDS = '視作品種類而定';

const LOW_EFFORT_ACTIONS = [
  '對原版作品留下印象，但沒有進一步行動',
  '搜尋原版作品的相關資訊（如評價、演員）',
  '將原版加入待看清單',
  '至 YouTube 等平台找其他此作品的濃縮影片觀看',
];

const HIGH_EFFORT_ACTIONS = [
  '在已訂閱的串流平台觀看作品部分內容',
  '在已訂閱的串流平台看完完整作品',
  '透過正版免費管道觀看原版（如電視播映、YouTube 官方頻道）',
  '透過非正式授權管道觀看原版（如盜版網站、非授權影片）',
  '特地為了看原版而訂閱新的串流平台',
  REASON_OTHER,
];

const Q3_ALL_ACTIONS = [...LOW_EFFORT_ACTIONS, ...HIGH_EFFORT_ACTIONS];

const Q3_1_REASONS = [
  '劇情已透過濃縮版完整了解，不需要再看原版',
  '看完濃縮版後，對原版的興趣或期待感降低',
  '有興趣但沒有足夠的時間',
  '有興趣但原版費用超出預算',
  '視影視作品種類而異',
];
const Q3_1_DEPENDS = '視影視作品種類而異';

const Q3_2_1_REASONS = [
  '劇情沒有完整交代，讓我想自己看完',
  '被情緒或畫面氛圍吸引，想親身感受',
  '看到網友熱烈討論，想加入話題',
  '濃縮版確認了該作品符合我的喜好',
  '親友的分享或推薦讓我更想看',
  '演員或製作陣容吸引我',
];

const Q3_2_2_FREQ_OPTIONS = ['幾乎不', '偶爾', '經常', '幾乎每次'];

const Q4_DISCOVERY_OPTIONS = [
  '完全不知道的新作品',
  '原本不會主動選擇的類型（如恐怖片、紀錄片）',
  '原本不會主動選擇的國家或語言的作品（如韓劇、日劇）',
  '以上皆有',
  '從未發生過，濃縮影片沒有擴展我的影視範圍',
];
const Q4_NONE = '從未發生過，濃縮影片沒有擴展我的影視範圍';

const Q5_IMPACT_OPTIONS = [
  '讓我看了更多原版作品',
  '讓我看了更少原版作品',
  '沒有明顯影響',
  '視作品而定，沒有固定傾向',
];

const Q6_GENRE_OPTIONS = [
  '懸疑',
  '愛情',
  '恐怖',
  '動作',
  '科幻',
  '搞笑',
  REASON_OTHER,
];

const AGE_OPTIONS = ['18 歲以下', '18–25 歲', '26–35 歲', '35 歲以上'];

const LOTTERY_TEXT =
  '感謝您參與本次問卷調查！\n\n' +
  '為表達感謝，我們將於問卷截止後，從所有完整填答者中抽出幸運得獎者，每位獲得星巴克飲料兌換券乙張。\n\n' +
  '若您有意願參與抽獎，請在下方輸入 email（僅作得獎通知，不作其他用途）。也可直接按「不參加抽獎，完成問卷」。';

let answers = {};
let aiFollowupState = null;
let aiFollowupDone = null;
let freeTextResolver = null;
let emailStepResolver = null;
let submissionTimestamp = null;
let savedSheetRowIndex = null;

const chatWrap = document.getElementById('chatWrap');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const progressBar = document.getElementById('progressBar');

function setProgress(p) {
  progressBar.style.width = Math.min(100, Math.max(0, p)) + '%';
}

function delay(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

function hasLowEffort(actions) {
  return (actions || []).some((a) => LOW_EFFORT_ACTIONS.includes(a));
}

function hasHighEffort(actions) {
  return (actions || []).some((a) => HIGH_EFFORT_ACTIONS.includes(a));
}

function createRow(who, text, isTyping = false) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (who === 'user' ? ' user' : '');

  const avatar = document.createElement('div');
  avatar.className = 'avatar' + (who === 'user' ? ' avatar-user' : '');
  avatar.textContent = who === 'user' ? 'ME' : BOT_AVATAR;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
  } else {
    bubble.innerHTML = String(text).replace(/\n/g, '<br>');
  }

  row.appendChild(avatar);
  row.appendChild(bubble);
  return row;
}

function scrollBottom() {
  setTimeout(() => {
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }, 50);
}

function addUserBubble(text) {
  const row = createRow('user', text);
  chatWrap.appendChild(row);
  scrollBottom();
}

function addBotBubble(text, withTyping = true) {
  return new Promise((resolve) => {
    if (withTyping) {
      const typingRow = createRow('bot', null, true);
      chatWrap.appendChild(typingRow);
      scrollBottom();
      setTimeout(() => {
        typingRow.remove();
        const row = createRow('bot', text);
        chatWrap.appendChild(row);
        scrollBottom();
        resolve();
      }, 900 + Math.random() * 400);
    } else {
      const row = createRow('bot', text);
      chatWrap.appendChild(row);
      scrollBottom();
      resolve();
    }
  });
}

function addSectionLabel(label) {
  const el = document.createElement('div');
  el.className = 'section-label';
  el.textContent = '── ' + label + ' ──';
  chatWrap.appendChild(el);
  scrollBottom();
}

function addQuickReplies(options, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';

  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      wrap.remove();
      onSelect(opt);
    });
    wrap.appendChild(btn);
  });

  chatWrap.appendChild(wrap);
  scrollBottom();
}

function addMultiReplies(options, { min = 1, exclusiveNone = null } = {}) {
  return new Promise((resolve) => {
    const selected = new Set();
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';

    const toggle = (label) => {
      if (exclusiveNone && label === exclusiveNone) {
        if (selected.has(exclusiveNone)) selected.delete(exclusiveNone);
        else {
          selected.clear();
          selected.add(exclusiveNone);
        }
      } else {
        if (exclusiveNone) selected.delete(exclusiveNone);
        if (selected.has(label)) selected.delete(label);
        else selected.add(label);
      }
      syncStyles();
    };

    const syncStyles = () => {
      buttons.forEach(({ label, el }) => {
        el.classList.toggle('selected', selected.has(label));
      });
      confirmBtn.disabled = selected.size < min;
    };

    const buttons = [];
    options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'qr-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => toggle(opt, btn));
      wrap.appendChild(btn);
      buttons.push({ label: opt, el: btn });
    });

    const actions = document.createElement('div');
    actions.className = 'multi-actions';
    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'qr-confirm';
    confirmBtn.textContent = '完成選擇';
    confirmBtn.disabled = true;
    confirmBtn.addEventListener('click', () => {
      wrap.remove();
      actions.remove();
      resolve([...selected]);
    });
    actions.appendChild(confirmBtn);

    chatWrap.appendChild(wrap);
    chatWrap.appendChild(actions);
    scrollBottom();
  });
}

async function askQuickPick(text, options) {
  await addBotBubble(text);
  return new Promise((resolve) => {
    addQuickReplies(options, async (sel) => {
      addUserBubble(sel);
      await delay(280);
      resolve(sel);
    });
  });
}

async function askMulti(text, options, opts) {
  await addBotBubble(text);
  const picked = await addMultiReplies(options, opts);
  addUserBubble(picked.join('、'));
  await delay(280);
  return picked;
}

async function askOtherSupplement(selection, otherLabel, answerKey) {
  if (!selection.includes(otherLabel)) return;
  await addBotBubble('你選擇了「其他」，請用一句話簡短補充（若不方便填寫可輸入「無」）。');
  const extra = await waitForFreeText();
  answers[answerKey] = extra.trim();
}

function waitForFreeText() {
  return new Promise((resolve) => {
    freeTextResolver = (text) => {
      disableInput();
      resolve(text);
    };
    userInput.placeholder = '輸入補充說明…';
    enableInput();
  });
}

function enableInput() {
  userInput.disabled = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function disableInput() {
  userInput.disabled = true;
  sendBtn.disabled = true;
  userInput.placeholder = '輸入你的回答…';
}

async function finishEarly(exitCode, botLines, endTitle, endBody) {
  await addBotBubble(botLines);
  addEndCard(endTitle, endBody);
  disableInput();
  await saveAnswersPayload({ early_exit: exitCode });
}

function addEndCard(title, bodyHtml) {
  const card = document.createElement('div');
  card.className = 'end-card';
  card.innerHTML =
    '<div class="icon">🎉</div><h2>' +
    title +
    '</h2><p>' +
    bodyHtml +
    '</p>';
  chatWrap.appendChild(card);
  scrollBottom();
}

function formatAnswersForPrompt() {
  const lines = [];
  const push = (k, v) => {
    if (v == null || v === '') return;
    if (Array.isArray(v)) {
      if (v.length) lines.push(`- ${k}：${v.join('、')}`);
    } else if (typeof v === 'object') {
      lines.push(`- ${k}：${JSON.stringify(v)}`);
    } else {
      lines.push(`- ${k}：${v}`);
    }
  };
  push('篩選：是否看過濃縮影片', answers.screening_watched);
  push('性別', answers.gender);
  push('年齡', answers.age);
  push('是否台大學生', answers.ntu_student);
  push('最常觀賞濃縮類型', answers.favorite_condensed_types);
  push('觀看濃縮影片動機', answers.watch_motivation);
  push('觀看後行動', answers.actions_after_condensed);
  push('未進一步行動原因', answers.low_effort_no_action_reasons);
  push('驅動觀看原版原因', answers.high_effort_watch_reasons);
  push('實際觀看原版頻率', answers.high_effort_watch_frequency);
  push('透過濃縮接觸新內容', answers.discovered_via_condensed);
  push('整體對接觸原版影響', answers.overall_impact_on_original);
  push('較易吸引觀看原版類型', answers.genres_attract_original);
  return lines.join('\n');
}

function buildFollowupSystemPrompt(topicInstruction, turn, maxTurns) {
  return `你是一個問卷訪談助理，正在進行「濃縮影片消費行為」的研究訪談。

受訪者目前已填答的內容：
${formatAnswersForPrompt()}

你現在要進行的追問任務：
${topicInstruction}

規則：
1. 語氣輕鬆、自然，像朋友在聊天，使用繁體中文。
2. 每次只問一個追問，不要一次問很多問題。
3. 追問必須與受訪者先前的答案相關，可引用具體選項。
4. 若受訪者已充分說明原因，直接收尾，不要硬追。
5. 最多追問 ${maxTurns} 輪；目前是第 ${turn} 輪（使用者剛完成一則回覆後計數）。若已達上限，請簡短致謝並輸出 [END]，不要提出新問題。
6. 不能評價受訪者的答案。
7. 不能討論與問卷無關的話題。
8. 收尾時說「謝謝你的分享！」並在訊息最後輸出 [END]。
9. 若回覆太短，可溫和邀請多說一點。
10. 不要重複已經問過的問題；開場白已由系統顯示，直接接續對話即可。`;
}

async function callGemini(systemPrompt, messages) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system: systemPrompt, messages }),
  });
  const data = await response.json();
  return (
    data?.candidates?.[0]?.content?.parts?.[0]?.text ||
    data?.content?.[0]?.text ||
    '謝謝你的分享！[END]'
  );
}

function buildAnswersSnapshot() {
  return {
    screening_watched: answers.screening_watched,
    gender: answers.gender,
    age: answers.age,
    ntu_student: answers.ntu_student,
    favorite_condensed_types: answers.favorite_condensed_types,
    favorite_condensed_other: answers.favorite_condensed_other,
    watch_motivation: answers.watch_motivation,
    watch_motivation_other: answers.watch_motivation_other,
    actions_after_condensed: answers.actions_after_condensed,
    actions_after_other: answers.actions_after_other,
    low_effort_no_action_reasons: answers.low_effort_no_action_reasons,
    high_effort_watch_reasons: answers.high_effort_watch_reasons,
    high_effort_watch_frequency: answers.high_effort_watch_frequency,
    discovered_via_condensed: answers.discovered_via_condensed,
    overall_impact_on_original: answers.overall_impact_on_original,
    genres_attract_original: answers.genres_attract_original,
    genres_attract_other: answers.genres_attract_other,
    email: answers.email || '',
  };
}

async function saveAnswersPayload({ early_exit, phase = 'complete' }) {
  if (!submissionTimestamp) {
    submissionTimestamp = new Date().toISOString();
  }

  const payload = {
    phase,
    timestamp: submissionTimestamp,
    rowIndex: savedSheetRowIndex,
    early_exit: early_exit || '',
    email: answers.email || '',
    answers: buildAnswersSnapshot(),
    followups: {
      motivation: answers.followup_motivation || null,
      low_effort: answers.followup_low_effort || null,
    },
    followup_motivation: answers.followup_motivation || null,
    followup_low_effort: answers.followup_low_effort || null,
  };

  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      console.warn('save failed', res.status, data);
      return false;
    }
    if (data.rowIndex) savedSheetRowIndex = data.rowIndex;
    return true;
  } catch (e) {
    console.warn('save error', e);
    return false;
  }
}

function finishAiFollowupSession() {
  if (aiFollowupDone) {
    const done = aiFollowupDone;
    aiFollowupDone = null;
    done();
  }
}

async function startAiFollowup({ firstQuestion, topicInstruction, storageKey }) {
  return new Promise(async (resolve) => {
    aiFollowupDone = resolve;
    aiFollowupState = {
      topicInstruction,
      storageKey,
      history: [],
      userReplies: 0,
      maxReplies: MAX_FOLLOWUP_REPLIES,
    };
    await addBotBubble(firstQuestion);
    aiFollowupState.history.push({ role: 'assistant', content: firstQuestion });
    enableInput();
  });
}

const FOLLOWUP_ACK_MESSAGES = [
  '謝謝你的分享，我了解了！',
  '收到，謝謝你願意多聊一點！',
  '了解了，感謝你的說明！',
];

function pickFollowupAck() {
  return FOLLOWUP_ACK_MESSAGES[
    Math.floor(Math.random() * FOLLOWUP_ACK_MESSAGES.length)
  ];
}

async function endAiFollowupSession({ lastBotText, hitReplyLimit, hadEndMarker }) {
  const state = aiFollowupState;
  if (!state) return;

  answers[state.storageKey] = [...state.history];

  const showGeminiClose =
    lastBotText &&
    (!hitReplyLimit || hadEndMarker) &&
    lastBotText.length > 0;

  if (showGeminiClose) {
    const row = createRow('bot', lastBotText);
    chatWrap.appendChild(row);
    scrollBottom();
    state.history.push({ role: 'assistant', content: lastBotText });
    answers[state.storageKey] = [...state.history];
    const alreadyThanks = /謝謝|感謝|了解|收到/.test(lastBotText);
    if (!alreadyThanks) {
      await delay(400);
      await addBotBubble(pickFollowupAck(), false);
    }
  } else {
    await addBotBubble(pickFollowupAck(), false);
  }

  aiFollowupState = null;
  await delay(500);
  finishAiFollowupSession();
}

async function handleAiFollowupReply(userText) {
  if (!aiFollowupState) return;

  aiFollowupState.history.push({ role: 'user', content: userText });
  aiFollowupState.userReplies++;
  disableInput();

  const hitReplyLimit =
    aiFollowupState.userReplies >= aiFollowupState.maxReplies;

  const typingRow = createRow('bot', null, true);
  chatWrap.appendChild(typingRow);
  scrollBottom();

  try {
    const systemPrompt = buildFollowupSystemPrompt(
      aiFollowupState.topicInstruction,
      aiFollowupState.userReplies,
      aiFollowupState.maxReplies,
    );
    const replyText = await callGemini(
      systemPrompt,
      aiFollowupState.history,
    );
    typingRow.remove();

    const hadEndMarker = replyText.includes('[END]');
    const cleanReply = replyText.replace(/\[END\]/g, '').trim();
    const shouldEnd = hadEndMarker || hitReplyLimit;

    if (shouldEnd) {
      await endAiFollowupSession({
        lastBotText: cleanReply,
        hitReplyLimit,
        hadEndMarker,
      });
      return;
    }

    const row = createRow('bot', cleanReply);
    chatWrap.appendChild(row);
    scrollBottom();
    aiFollowupState.history.push({ role: 'assistant', content: cleanReply });
    answers[aiFollowupState.storageKey] = [...aiFollowupState.history];
    enableInput();
  } catch (err) {
    typingRow.remove();
    if (aiFollowupState) {
      answers[aiFollowupState.storageKey] = [...aiFollowupState.history];
    }
    await addBotBubble('謝謝你的分享！🙏', false);
    aiFollowupState = null;
    await delay(500);
    finishAiFollowupSession();
  }
}

async function runMotivationFollowup() {
  const topic =
    '受訪者選擇觀看濃縮影片的動機為「視作品種類而定」。請追問：不同作品類型（如劇集、電影、綜藝）如何影響其觀看濃縮片或去看原版的意願？';
  await startAiFollowup({
    firstQuestion:
      '你選擇「視作品種類而定」——方便舉例說說，哪些類型的作品你比較會看濃縮片？哪些又會讓你想去看原版？',
    topicInstruction: topic,
    storageKey: 'followup_motivation',
  });
}

async function runLowEffortDependsFollowup() {
  const topic =
    '受訪者選擇未進一步行動的原因之一為「視影視作品種類而異」。請追問：什麼樣的作品類型較容易吸引他去看原版（例如懸疑類想自己找解答）？';
  await startAiFollowup({
    firstQuestion:
      '你提到「視影視作品種類而異」——哪些類型的作品會讓你比較想去看原版？哪些則不會？可以舉例說明嗎？',
    topicInstruction: topic,
    storageKey: 'followup_low_effort',
  });
}

async function runEmailStep() {
  await addBotBubble(LOTTERY_TEXT);

  return new Promise((resolve) => {
    addQuickReplies(['不參加抽獎，完成問卷'], async () => {
      addUserBubble('不參加抽獎，完成問卷');
      disableInput();
      addEndCard(
        '感謝你的參與！',
        '你的回答已記錄。祝你有美好的一天 ☀️',
      );
      resolve();
    });
    userInput.placeholder = '選填：輸入 email 後按送出';
    enableInput();
    emailStepResolver = resolve;
  });
}

async function finishSurveyAndEmail() {
  await addBotBubble('謝謝你完成問卷本體！你的回答非常有價值 🙏');
  await saveAnswersPayload({ early_exit: '', phase: 'complete' });
  await runEmailStep();
}

async function runInterview() {
  disableInput();
  setProgress(2);
  addSectionLabel('問卷說明');
  await addBotBubble(INTRO_TEXT);

  answers.screening_watched = await askQuickPick(
    '您是否看過上述定義的濃縮影片？',
    ['是', '否'],
  );
  setProgress(8);

  if (answers.screening_watched === '否') {
    await finishEarly(
      EARLY_EXIT.SCREENING_NO,
      '了解，本問卷主要調查有觀看濃縮影片經驗的受眾。感謝您的參與！',
      '感謝您的參與！',
      '已記錄您的回覆。',
    );
    return;
  }

  addSectionLabel('個人基本資料');
  answers.gender = await askQuickPick('您的性別？', [
    '女',
    '男',
    '不方便透露',
  ]);
  setProgress(14);

  answers.age = await askQuickPick('您的年齡？', AGE_OPTIONS);
  setProgress(20);

  answers.ntu_student = await askQuickPick('您是否為台大學生？', ['是', '否']);
  setProgress(26);

  addSectionLabel('觀看經驗');
  answers.favorite_condensed_types = await askMulti(
    '您平時最常觀賞以下哪些類型的濃縮影片？（可複選）',
    Q1_TYPE_OPTIONS,
    { min: 1 },
  );
  await askOtherSupplement(
    answers.favorite_condensed_types,
    REASON_OTHER,
    'favorite_condensed_other',
  );
  setProgress(36);

  answers.watch_motivation = await askQuickPick(
    '您觀看濃縮影片的動機為何？',
    Q2_MOTIVATION_OPTIONS,
  );
  setProgress(44);
  if (answers.watch_motivation === REASON_OTHER) {
    await addBotBubble('請簡短說明您的其他動機。');
    answers.watch_motivation_other = (await waitForFreeText()).trim();
  }
  if (answers.watch_motivation === Q2_DEPENDS) {
    await runMotivationFollowup();
  }
  setProgress(50);

  answers.actions_after_condensed = await askMulti(
    '承上題，請選出最符合您「觀看完濃縮影片後」的行動。（可複選）',
    Q3_ALL_ACTIONS,
    { min: 1 },
  );
  await askOtherSupplement(
    answers.actions_after_condensed,
    REASON_OTHER,
    'actions_after_other',
  );
  setProgress(58);

  if (hasLowEffort(answers.actions_after_condensed)) {
    answers.low_effort_no_action_reasons = await askMulti(
      '承上題，您未進一步行動的原因為何？（可複選）',
      Q3_1_REASONS,
      { min: 1 },
    );
    if (
      (answers.low_effort_no_action_reasons || []).includes(Q3_1_DEPENDS)
    ) {
      await runLowEffortDependsFollowup();
    }
  }

  if (hasHighEffort(answers.actions_after_condensed)) {
    answers.high_effort_watch_reasons = await askMulti(
      '承上題，驅動您觀看原版作品的主要原因是？（可複選）',
      Q3_2_1_REASONS,
      { min: 1 },
    );
    answers.high_effort_watch_frequency = await askQuickPick(
      '承上題，您實際付諸行動去觀看原版作品的頻率大約是？',
      Q3_2_2_FREQ_OPTIONS,
    );
  }
  setProgress(72);

  answers.discovered_via_condensed = await askMulti(
    '您是否曾透過濃縮影片，接觸到以下原本不熟悉的影視內容？（可複選）',
    Q4_DISCOVERY_OPTIONS,
    { min: 1, exclusiveNone: Q4_NONE },
  );
  setProgress(82);

  answers.overall_impact_on_original = await askQuickPick(
    '整體而言，觀看濃縮影片對您接觸原版作品的影響是？',
    Q5_IMPACT_OPTIONS,
  );
  setProgress(90);

  answers.genres_attract_original = await askMulti(
    '哪些種類的影視作品較容易吸引您去觀看原版？（可複選）',
    Q6_GENRE_OPTIONS,
    { min: 1 },
  );
  await askOtherSupplement(
    answers.genres_attract_original,
    REASON_OTHER,
    'genres_attract_other',
  );
  setProgress(98);

  await finishSurveyAndEmail();
}

async function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;

  if (freeTextResolver) {
    userInput.value = '';
    userInput.style.height = 'auto';
    addUserBubble(text);
    disableInput();
    const fn = freeTextResolver;
    freeTextResolver = null;
    fn(text);
    return;
  }

  userInput.value = '';
  userInput.style.height = 'auto';
  disableInput();

  addUserBubble(text);

  if (emailStepResolver) {
    const email = text.trim();
    if (email && email.includes('@')) {
      answers.email = email;
      await saveAnswersPayload({ phase: 'email' });
    }
    disableInput();
    addEndCard(
      '感謝你的參與！',
      email
        ? '你的回答與 email 已記錄，若中獎將以 email 通知。祝你有美好的一天 ☀️'
        : '你的回答已記錄。祝你有美好的一天 ☀️',
    );
    const done = emailStepResolver;
    emailStepResolver = null;
    done();
    return;
  }

  if (aiFollowupState) {
    await handleAiFollowupReply(text);
  }
}

let isComposing = false;
userInput.addEventListener('compositionstart', () => {
  isComposing = true;
});
userInput.addEventListener('compositionend', () => {
  isComposing = false;
});

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    if (e.isComposing || isComposing) return;
    e.preventDefault();
    handleSend();
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
});

disableInput();
runInterview();
